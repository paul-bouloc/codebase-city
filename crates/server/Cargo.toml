[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
analyzer = { path = "../analyzer" }
anyhow = "1.0.104"
axum = "0.8.9"
brotli = "9.1.1"
bytes = "1.12.1"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
model = { path = "../model" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "macros"] }
tar = "0.4.46"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "net", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["fs", "trace"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
futures-util = "0.3.34"
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
