# Local development services. Credentials are for local use only.
name: codebase-city

services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: codebase_city
      POSTGRES_PASSWORD: codebase_city
      POSTGRES_DB: codebase_city
    ports:
      # Dedicated host port, to avoid clashing with another local Postgres.
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codebase_city -d codebase_city"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
